regression:
  stages:
    - regression.setup # generage compiles.yml
    - setup
    - compile_simulate

regression.setup:
  steps:
    - evaluate: env.TAG_VERSION = readFile('VERIFICATION/.jenkins/RTL_version').trim()
    - sh: "${env.sourcefiles} /Infra/Tools/python/3.11.11/bin/python3
        VERIFICATION/.jenkins/regression_v2/setup.py"

compile_simulate:
  parallels:
    - compile from compiles.yml
    - regression.simulate

regression.simulate:
  steps:
    - sh: "${env.sourcefiles} /Infra/Tools/python/3.11.11/bin/python3
        VERIFICATION/.jenkins/regression_v2/executor.py"
    - sh: "rm -rf VERIFICATION; unlink DESIGN"

generation:
  stages:
    - generation_setup
    - parallel_run_script

parallel_run_script:
  parallels:
    - gen_vector

gen_vector:
  steps:
    - sh: "echo start gen_vector"
    - sh: "${env.sourcefiles} srun -p jenkins --symbol=dv_script csh
        VERIFICATION/script/system_run/gen_vector.csh"
    - sh: "echo start post_gen_vector"
    - sh: "${env.sourcefiles} srun -p jenkins --symbol=dv_script csh
        VERIFICATION/script/system_run/post_gen_vector.csh"
