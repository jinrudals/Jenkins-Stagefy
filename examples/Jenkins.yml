  steps:
    - sh: "${env.sourcefiles} /Infra/Tools/python/3.11.11/bin/python3
        VERIFICATION/.jenkins/regression_v2/common.py --action=scratch cpustub"
    - sh: "${env.sourcefiles} /Infra/Tools/python/3.11.11/bin/python3
        VERIFICATION/.jenkins/regression_v2/common.py --action=test
        test_elab-cpustub-pkg=sanity_pkg-test_c=base_test_c-vseq_c=sanity_MR_vs\
        eq_c-HACK_BOOT-SKIP_MIF_INIT-SKIP_CMU_INIT-SKIP_ENABLE_ERROR"
    - sh: "grep -e 'TEST PASSED'
        outfeed1/test_elab-cpustub-pkg=sanity_pkg-test_c=base_test_c-vseq_c=san\
        ity_MR_vseq_c-HACK_BOOT-SKIP_MIF_INIT-SKIP_CMU_INIT-SKIP_ENABLE_ERROR/r\
        un_log.log"

