env:
  PRJ_NAME: n1dv
  USER_NAME: jenkins
  PATH: /app/git2.41.0/bin/:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  sourcefiles: "#!/bin/env csh

    echo 'Source Files'; source /workspace/project/N1B0/dv/LIB/n1_prj_env.csh;
    source VERIFICATION/.jenkins/SourceMe.csh; source
    VERIFICATION/.jenkins/env.csh;"

MR:
  stages:
    - setup
    - compile
    #- simulation

# template example: define a reusable step set and iterate over env var or inline list
compile_target:
  template:
    arguments: [TARGET]
  steps:
    - sh: "${env.sourcefiles} make clean TARGET={TARGET}"
    - sh: "${env.sourcefiles} make build TARGET={TARGET}"

# parallel builds driven by a Jenkins parameter: COMPILE_TARGETS=cpustub,armrtl,bus
compile_all_targets:
  parallels:
    - iterated:
        template: compile_target
        over: env.COMPILE_TARGETS

# use directive example: generate YAML dynamically then reference its stage
use_example:
  steps:
    - sh: |
        cat << 'EOF' > dynamic_tasks.yaml
        run_checks:
          parallels:
            - check_a
            - check_b
        check_a:
          steps:
            - sh: echo "check A passed"
        check_b:
          steps:
            - sh: echo "check B passed"
        EOF
    - use: run_checks from dynamic_tasks.yaml
    - sh: echo "all checks complete"

setup:
  steps:
    - evaluate: env.TAG_VERSION = readFile('VERIFICATION/.jenkins/RTL_version').trim()
    - sh: /Infra/Tools/python/3.11.11/bin/python3 VERIFICATION/.jenkins/reload.py
    - sh: "${env.sourcefiles} /Infra/Tools/python/3.11.11/bin/python3
        VERIFICATION/.jenkins/regression_v2/common.py --action=update update"

generation_setup:
  steps:
    - sh: echo ${env.TARGET_TAG_VERSION} > VERIFICATION/.jenkins/RTL_version
    - evaluate: env.TAG_VERSION = readFile('VERIFICATION/.jenkins/RTL_version').trim()
    - sh: /Infra/Tools/python/3.11.11/bin/python3 VERIFICATION/.jenkins/reload.py

compile:
  parallels:
    - cpustub_compile_sim
    - armrtl_compile_sim
    - armrtl_m_compile_sim
    - armrtl_f_compile
    - cpustub_n_compile
    - bus_compile
    - cpustub_u_compile
    - cpustub_p_compile

